<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>栈灯 · 本地 AI 编程助手</title>
  <link rel="stylesheet" href="static/style.css?v=20261003-6">
</head>
<body>
  <div class="app-shell">
    <aside class="rail">
      <div class="brand-mark">栈</div>
      <button class="rail-icon active" title="工作区">▦</button>
      <button class="rail-icon" title="设置" id="settingsBtn">⚙</button>
      <div class="rail-bottom">本机</div>
    </aside>
    <aside class="sidebar">
      <div class="sidebar-head"><div><span class="eyebrow">本地工作区</span><h1>项目文件</h1></div><span class="status-dot" title="仅在本机运行"></span></div>
      <button class="choose-button" id="chooseFolder"><span>＋</span> 选择项目文件夹</button>
      <div class="workspace-path" id="workspacePath">尚未选择文件夹</div>
      <div class="file-toolbar"><span>上下文文件</span><span id="fileCount">0</span></div>
      <div class="file-search"><span>⌕</span><input id="fileSearch" placeholder="查找文件…"></div>
      <div class="file-list" id="fileList"><div class="empty-files">选择一个文件夹<br>开始浏览项目</div></div>
      <div class="sidebar-foot"><span class="shield">◇</span><span>文件只在你选择的目录内读取</span></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="crumb"><span>工作区</span><b>/</b><strong id="projectName">新会话</strong></div><div class="top-actions"><span class="local-pill"><i></i> 本机模式</span><button class="quiet-button" id="newChat">＋ 新会话</button><div class="avatar">我</div></div></header>
      <section class="conversation" id="conversation">
        <div class="welcome" id="welcome">
          <div class="welcome-icon"><span>⌘</span><i>✳</i></div>
          <div class="welcome-kicker">栈灯 · AI 编程搭档</div>
          <h2>把需求说清楚，<br><em>让改动可审查。</em></h2>
          <p>选中项目目录和相关文件，描述问题或目标。先检查改动差异，确认后再应用。</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="先梳理项目结构、启动入口和主要调用链，结论结合文件说明。"><span>⌘</span><div><b>梳理项目</b><small>入口、模块和调用关系</small></div><span class="arrow">↗</span></button>
            <button class="suggestion" data-prompt="检查我选中的文件，优先找可能导致错误或安全问题的点。说明原因，并给出必要的修改。"><span>⌕</span><div><b>代码走查</b><small>定位问题并说明依据</small></div><span class="arrow">↗</span></button>
            <button class="suggestion" data-prompt="为选中的文件补充必要的中文注释或文档，保留项目现有的命名和代码风格。"><span>✎</span><div><b>补充说明</b><small>贴合现有项目风格</small></div><span class="arrow">↗</span></button>
          </div>
        </div>
        <div class="messages" id="messages"></div>
        <div class="composer-wrap">
          <form class="composer" id="chatForm">
            <textarea id="prompt" rows="1" placeholder="例如：修复这个报错，并解释改动原因…" disabled></textarea>
            <div class="composer-bottom"><div class="composer-hint"><span>↳</span> 修改建议会先展示供你审阅</div><button class="send-button" id="sendBtn" type="submit" disabled><span>发送</span><b>↑</b></button></div>
          </form>
          <div class="composer-note">AI 生成的内容可能需要检查。应用修改前请先查看差异。</div>
        </div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <dialog id="settingsDialog"><form method="dialog"><button class="dialog-close" aria-label="关闭">×</button><div class="dialog-kicker">本机设置</div><h2>DeepSeek 接口密钥</h2><p>填写自己的密钥，栈灯会保存在本机用户配置目录中。</p><label class="setting-label" for="deepseekApiKey">DeepSeek 接口密钥</label><div class="api-key-entry"><input id="deepseekApiKey" type="password" placeholder="粘贴 DeepSeek 接口密钥"><button type="button">保存</button></div><div class="api-key-status">密钥不会提交到项目仓库；你勾选的代码会发送给 DeepSeek。</div><div class="setting-row"><span>当前模型</span><code>deepseek-flash</code></div><button class="dialog-done">完成</button></form></dialog>

</body>
</html>
